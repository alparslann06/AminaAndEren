<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For Amina</title>
  <meta name="description" content="A little something for Amina’s birthday.">
  <meta name="theme-color" content="#ffe3ec">
  <meta property="og:title" content="For Amina">
  <meta property="og:description" content="A little something for your birthday.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..500,100&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">

  <!-- heart sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.7 4.5 6.3 4.5c2 0 3.7 1.1 4.7 2.7h2c1-1.6 2.7-2.7 4.7-2.7 3.6 0 5.5 3.8 3.9 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></symbol>
  </svg>

  <!-- background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__layer">
      <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
      <div class="floaters" id="floaters"></div>
    </div>
  </div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <!-- top bar -->
  <header class="top">
    <div class="badge" aria-label="For Amina">
      <svg class="bh bh--1" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="bh bh--2" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="bh bh--3" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="bh bh--4" aria-hidden="true"><use href="#heart"/></svg>
      <svg class="bh bh--main" aria-hidden="true"><use href="#heart"/></svg>
      <span class="badge__text">For Amina</span>
      <svg class="bh bh--main bh--r" aria-hidden="true"><use href="#heart"/></svg>
    </div>
    <div class="tools">
      <button class="icon-btn" id="music" type="button" aria-pressed="false" aria-label="Play music" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="i-play" d="M9 7v10l8-5z" fill="currentColor"/><g class="i-pause" fill="currentColor"><rect x="8" y="7" width="3" height="10" rx="1"/><rect x="13" y="7" width="3" height="10" rx="1"/></g></svg>
      </button>
      <button class="icon-btn" id="fs" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- the presentation -->
  <main class="deck" id="deck" aria-live="polite"></main>
  <noscript><p style="position:fixed;inset:40% 1rem auto;text-align:center">This little gift needs JavaScript to open. Please turn it on.</p></noscript>

  <p class="hint" id="hint"></p>
  <nav class="controls" aria-label="Slides">
    <button class="icon-btn" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="icon-btn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>

  <!-- intro: blow out the candle -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro__inner">
      <h1 class="intro__title" id="intro-title">Make a wish, Amina</h1>
      <p class="intro__sub">Blow out the candle to open your surprise.</p>
      <svg class="cake" viewBox="0 0 320 300" aria-hidden="true">
        <defs>
          <clipPath id="tierA"><rect x="40" y="190" width="240" height="84" rx="18"/></clipPath>
          <clipPath id="tierB"><rect x="80" y="130" width="160" height="66" rx="16"/></clipPath>
        </defs>
        <ellipse cx="160" cy="276" rx="140" ry="14" fill="#f3b4c9" opacity=".55"/>
        <rect x="40" y="190" width="240" height="84" rx="18" fill="#ffd3e1"/>
        <g clip-path="url(#tierA)" fill="#fff"><rect x="40" y="190" width="240" height="14"/><circle cx="52" cy="204" r="12"/><circle cx="76" cy="204" r="12"/><circle cx="100" cy="204" r="12"/><circle cx="124" cy="204" r="12"/><circle cx="148" cy="204" r="12"/><circle cx="172" cy="204" r="12"/><circle cx="196" cy="204" r="12"/><circle cx="220" cy="204" r="12"/><circle cx="244" cy="204" r="12"/><circle cx="268" cy="204" r="12"/></g>
        <circle cx="80" cy="246" r="6" fill="#e4608f"/><circle cx="130" cy="252" r="6" fill="#fff"/>
        <circle cx="190" cy="246" r="6" fill="#e4608f"/><circle cx="240" cy="252" r="6" fill="#fff"/>
        <rect x="80" y="130" width="160" height="66" rx="16" fill="#ffc2d6"/>
        <g clip-path="url(#tierB)" fill="#fff"><rect x="80" y="130" width="160" height="14"/><circle cx="94" cy="144" r="11"/><circle cx="116" cy="144" r="11"/><circle cx="138" cy="144" r="11"/><circle cx="160" cy="144" r="11"/><circle cx="182" cy="144" r="11"/><circle cx="204" cy="144" r="11"/><circle cx="226" cy="144" r="11"/></g>
        <circle cx="120" cy="178" r="5" fill="#c99a5b"/><circle cx="160" cy="184" r="5" fill="#c99a5b"/><circle cx="200" cy="178" r="5" fill="#c99a5b"/>
        <g>
          <rect x="154" y="92" width="12" height="40" rx="4" fill="#fff"/>
          <rect x="154" y="100" width="12" height="6" fill="#e4608f"/><rect x="154" y="114" width="12" height="6" fill="#e4608f"/>
          <path class="flame" d="M160 58c9 11 9 22 0 28-9-6-9-17 0-28z" fill="#ffb347"/>
          <path class="flame" d="M160 68c4 6 4 12 0 15-4-3-4-9 0-15z" fill="#fff3c4"/>
        </g>
        <g class="smoke" fill="none" stroke="#c9a3b3" stroke-width="2" stroke-linecap="round" opacity="0"><path d="M160 80c-6-10 6-14 0-26"/></g>
      </svg>
      <button class="btn btn--primary" id="blow" type="button">Blow out the candle</button>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" loop preload="none"></audio>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
